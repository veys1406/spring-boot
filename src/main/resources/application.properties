spring.application.name=spboot
jwt.secret=${JWT_SECRET}
cors.origin=http://localhost:5173

#ratelimit.loginIp.path=/login
#ratelimit.registerIp.path=/register

ratelimit.loginIp.capacity=5
ratelimit.loginIp.fillRate=5
ratelimit.loginIp.window=1m

ratelimit.registerIp.capacity=5
ratelimit.registerIp.fillRate=5
ratelimit.registerIp.window=1m

ratelimit.registerMail.capacity=1
ratelimit.registerMail.fillRate=1
ratelimit.registerMail.window=1d

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.mongodb.uri=mongodb://localhost:27017/spboot
spring.mail.host=localhost
spring.mail.port=1025
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=5000ms
spring.rabbitmq.listener.simple.retry.multiplier=1.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms
#spring.rabbitmq.listener.simple.prefetch=1
spring.mvc.problemdetails.enabled=true
